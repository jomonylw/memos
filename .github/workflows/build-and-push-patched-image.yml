name: build-and-push-patched-image

# Builds the patched Memos image (SQLite pool cap + no full-DB VACUUM on delete)
# and pushes it to GitHub Container Registry so Unraid can pull it directly.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag to build and push (e.g. v0.18.2-patch.10)'
        required: true
        default: 'v0.18.2-patch.10'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Free disk space
        run: |
          # The pnpm frontend build needs far more disk than the default runner has.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # Always publish "latest" so Unraid can pull a fixed image name and
            # pick up new builds via Force Download New Image, without editing
            # the template every time.
            type=raw,value=latest
            # Keep the leading "v" so the version tag matches the git tag.
            type=raw,value=${{ inputs.tag || github.ref_name }}
            type=semver,pattern={{version}},value=${{ inputs.tag || github.ref_name }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max